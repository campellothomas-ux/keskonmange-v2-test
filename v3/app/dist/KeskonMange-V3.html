  <script>(()=>{var en={schema:"keskonmange-v3-library/1",version:1,sourceArchiveSha256:"3dda40f91991647262dd4e75f0ad5b96547ac6fe96a49a63867e1d0ebdfa8dca",baseCommit:"895c3d07d968761feceb9c4f3f08fb59bbad6fd4",validation:{technical:"checked_by_tests",culinary:"pending"},recipes:[{id:"r_boulettes_de_porc_au_paprika__sauce_cr_m",name:"Boulettes de porc au paprika, sauce crémeuse et purée de patate douce",originalV1:{etapes:["Préchauffer le four à 210 °C en chaleur tournante. Éplucher les carottes et les couper en bâtonnets.","Mélanger les carottes avec 1 cuillère à soupe d'huile d'olive, le thym, du sel et du poivre. Les étaler sur une plaque et enfourner pendant 25 à 30 minutes.","Éplucher les patates douces et les pommes de terre puis les couper en morceaux réguliers. Les cuire ensemble dans une casserole d'eau salée pendant 20 minutes, jusqu'à ce qu'elles soient bien tendres.","Pendant ce temps, hacher très finement l'oignon et l'ail.","Dans un saladier, mélanger le porc haché, l'œuf, la chapelure, la moitié de l'oignon, l'ail, le paprika fumé, du sel et du poivre.","Former environ 12 petites boulettes de taille régulière.","Faire chauffer 1 cuillère à soupe d'huile d'olive dans une grande poêle. Faire dorer les boulettes pendant 6 à 8 minutes en les retournant régulièrement.","Ajouter le reste de l'oignon dans la poêle et poursuivre la cuisson pendant 2 minutes.","Verser le bouillon et ajouter la moutarde. Couvrir partiellement et laisser mijoter 6 à 8 minutes, jusqu'à ce que les boulettes soient bien cuites à cœur.","Égoutter les pommes de terre et les patates douces. Les écraser avec le beurre et le lait chaud jusqu'à obtenir une purée onctueuse. Saler et poivrer.","Baisser le feu sous les boulettes. Prélever quelques cuillères de sauce chaude et les mélanger progressivement au yaourt grec dans un bol pour le tempérer.","Couper le feu puis incorporer le yaourt tempéré dans la poêle. Mélanger doucement sans faire bouillir pour éviter que la sauce ne tranche.","Ser bols : une demi-botte au total proposée, contre 2,5 bottes en V1.",status:"demo_applied_not_culinary_validated"}],reservations:["Recette non essayée en conditions réelles.","Poids de conserves exprimés égouttés ; conditionnement brut inconnu."]}},{id:"r_bowl_poulet_facon_kebab__pommes_de_terre",name:"Bowl poulet facon kebab, pommes de terre roties Air Fryer et sauce blanche",originalV1:{etapes:["Laver les pommes de terre et les couper en petits cubes ou en quartiers reguliers d'environ 2 cm. Conserver la peau si elle est fine puis bien les secher avec un torchon propre afin de favoriser le croustillant","Melanger les pommes de terre avec 1 cuillere a soupe d'huile d'olive, 1 cuillere a cafe de paprika fume, la moitie de l'origan, du sel et du poivre","Prechauffer l'Air Fryer a 200 degres pendant environ 3 minutes. Placer les pommes de terre dans le panier sans trop les entasser puis cuire a 200 degres pendant 18 a 22 minutes. Secouer le panier apres 8 a 10 minutes puis une nouvelle fois quelques minutes avant la fin. Prolonger de 2 a 3 minutes si necessaire pour obtenir des pommes de terre bien dorees et croustillantes","Couper le poulet en fines lamelles. Le placer dans un saladier avec 1 cuillere a soupe d'huile d'olive, 1 cuillere a cafe de paprika fume, le cumin, la coriandre moulue, le reste de l'origan, 1 gousse d'ail pressee et le jus d'un demi-citron. Saler, poivrer et bien melanger","Faire chauffer une grande poele a feu vif. Ajouter le poulet marine et le faire cuire pendant 7 a 9 minutes en remuant regulierement jusqu'a ce qu'il soit bien dore sur les bords et cuit a coeur","Preparer la sauce blanche en melangeant le yaourt grec avec 1 gousse d'ail pressee, le jus du demi-citron restant, du persil frais cisele, du sel et du poivre. Ajouter 1 a 2 cuilleres a soupe d'eau si necessaire pour obtenir une sauce fluide et cremeuse","Couper les tomates et le concombre en petits morceaux. Emincer finement l'oignon rouge et laver la salade","Repartir la salade, les éelles.","Poids de conserves exprimés égouttés ; conditionnement brut inconnu."]}},{id:"r_cheeseburgers_maison_et_frites_de_patate",name:"Cheeseburgers maison et frites de patate douce au four",source:{archive:"KeskonMange_V3_REVISE_98_DOSSIER.zip",archiveSha256:"3dda40f91991647262dd4e75f0ad5b96547ac6fe96a49a63867e1d0ebdfa8dca",reviewFile:"pilot-source-review.json",sourceIndex:15},originalV1:{etapes:["Préchauffer le four à 210 °C en chaleur tournante. Recouvrir une grande plaque de papier cuisson.","Éplucher les patates douces et les couper en frites régulières, d'environ 1 cm d'épaisseur. Les sécher soigneusement avec un torchon propre pour favoriser la coloration.","Dans un saladier, mélanger les frites avec 2 cuillères à soupe d'huile d'olive et le paprika doux. Les répartir sur la plaque en une seule couche, sans trop les serrer. Utiliser deux plaques si nécessaire.","Enfourner pendant 25 à 35 minutes selon l'épaisseur des frites. Les retourner à mi-cuisson. Elles doivent être dorées sur les bords et tendres à cœur. Saler après cuisson.","Pendant ce temps, préparer la sauce burger légère en mélangeant le yaourt grec, le ketchup et la moutarde douce. Réserver au frais.","Laver les tomates et la salade. Couper les tomates en rondelles et émincer finement l'oignon rouge. Pour les enfants, l'oignon peut être supprimé.","Faire chauffer une poêle antiadhésive à feu moyen-vif. Déposer les steaks hachés et les cuire selon leur épaisseur, en les retournant à mi-cuisson. Pour les enfants, veiller à une cuisson complète à cœur.","Déposer une tranche de cheddar sur chaque steak pendant la dernière minute de cuisson. Couvrir brièvement la poêle pour faire fondre le fromage.","Couper les pains à burger en deux et les faire légèrement toaster dans une poêle sèche, face coupée vers le bas, pendant 1 à 2 minutes.","Monter les burgers : étaler un peu de sauce sur le pain inférieur, ajouter la salade, le steak au cheddar, les rondelles de tomate et éventuellement l'oignon rouge. Refermer avec le pain supérieur.","Servir immédiatement avec les frites de patate douce. Pour la petite de 3 ans, adapter la taille du burger et des portions à son appétit, et couper les aliments en morceaux faciles à manger."],ingredients:[{nom:"Pains à burger",qte:4,rayon:3,unite:"piece"},{nom:"Steaks hachés de bœuf 5 % MG",qte:4,rayon:1,unite:"piece"},{nom:"Cheddar en tranches",qte:4,rayon:2,unite:"piece"},{nom:"Patates douces",qte:900,rayon:0,unite:"g"},{nom:"Tomates",qte:2,rayon:0,unite:"piece"},{nom:"Salade verte",qte:100,rayon:0,unite:"g"},{nom:"Oignon rouge",qte:1,rayon:0,unite:"piece"},{nom:"Yaourt grec nature",qte:100,rayon:2,unite:"g"},{nom:"Ketchup",qte:2,rayon:3,unite:"cas"},{nom:"Moutarde douce",qte:1,rayon:3,unite:"cc"},{nom:"Huile d'olive",qte:2,rayon:3,unite:"cas"},{nom:"Paprika doux",qte:1,rayon:3,unite:"cc"},{nom:"Sel",qte:1,rayon:3,unite:"pincee"},{nom:"Poivre",qte:1,rayon:3,unite:"pincee"}],nom:"Cheeseburgers maison et frites de patate douce au four",personnes:4,temps:45},review:{state:"pending_household_and_culinary_review",priority:"P2",productionModeCandidate:"individual_units",sourceDeclaredPeople:4,proposedServings:4,yieldEvidence:"source_declared_only",yieldNote:"Nombre de portions repris de la V1 à titre provisoire, sans validation de la satiété ni du rendement physique.",producedUnitCount:4,mealCompleteness:"already_in_recipe",animalIngredientsGramsPerSourcePerson:null,dryStarchesGramsPerSourcePerson:null,auditFlags:["UNITES_CUISINEES_A_COMPTER"],ingredientsWithReviewFlags:[{ingredientIndex:8,name:"Ketchup",flags:["MESURE_CULINAIRE_NON_CONVERTIE"]},{ingredientIndex:9,name:"Moutarde douce",flags:["MESURE_CULINAIRE_NON_CONVERTIE"]},{ingredientIndex:10,name:"Huile d'olive",flags:["MESURE_CULINAIRE_NON_CONVERTIE"]},{ingredientIndex:11,name:"Paprika doux",flags:["MESURE_CULINAIRE_NON_CONVERTIE"]}],ingredientChangeProposals:[],specificReviewNote:"Quatre burgers = quatre pains et quatre steaks. Le grammage d’un steak doit être connu avant toute ontent a la surface, les egoutter soigneusement. Conserver quelques cuilleres a soupe d'eau de cuisson","Ajouter le reste de l'huile d'olive dans la poele avec les courgettes puis ajouter les gnocchis egouttes. Les faire dorer 4 a 5 minutes a feu moyen-vif sans trop les remuer afin qu'une legere croute se forme","Remettre le poulet dans la poele puis ajouter les tomates sechees. Melanger et laisser chauffer 1 a 2 minutes","Dans un bol, melanger le yaourt grec avec le parmesan rape, le jus du demi-citron, du poivre et 2 a 3 cuilleres a soupe d'eau de cuisson des gnocchis afin d'obtenir une sauce cremeuse","Couper le feu sous la poele puis attendre environ 30 secondes avant d'ajouter la sauce au yaourt grec. Melanger delicatement pour enrober les gnocchis, le poulet et les legumes. Ne pas faire bouillir la sauce afin d'eviter que le yaourt ne tranche","Rectifier l'assaisonnement si necessaire. Ajouter le persil ou le basilic frais juste avant de servir et repartir immediatement dans 3 assiettes"],ingredients:[{nom:"Gnocchis de pomme de terre",qte:500,rayon:3,unite:"g"},{nom:"Filets de poulet",qte:400,rayon:1,unite:"g"},{nom:"Courgettes",qte:2,rayon:0,unite:"piece"},{nom:"Tomates sechees",qte:70,rayon:3,unite:"g"},{nom:"Yaourt grec nature",qte:150,rayon:2,unite:"g"},{nom:"Parmesan rape",qte:40,rayon:2,unite:"g"},{nom:"Ail",qte:2,rayon:0,unite:"gousse"},{nom:"Huile d'olive",qte:1,rayon:3,unite:"cas"},{nom:"Paprika fume",qte:1,rayon:3,unite:"cc"},{nom:"Herbes de Provence",qte:1,rayon:3,unite:"cc"},{nom:"Citron",qte:.5,rayon:0,unite:"piece"},{nom:"Persil ou basilic frais",qte:.5,rayon:0,unite:"botte"},{nom:"Sel poivre",qte:1,rayon:3,unite:"pincee"}],nom:"Gnocchis poeles au poulet, courgette, tomates sechees et sauce yaourt grec parmesan",personnes:3,temps:30},review:{state:"pending_household_and_culinary_review",priority:"P2",productionModeCandidate:"adjustable",sourceDeclaredPeople:3,proposedServings:3,yieldEvidence:"source_declared_only",yieldNote:"Nombre de portions re r obtenir une sauce épaisse et onctueuse. Ajouter un peu d'eau si nécessaire. Assaisonner avec la muscade, le sel et le poivre.","Faire tomber les épinards frais dans une poêle pendant 2 à 3 minutes. Pour des épinards surgelés, les décongeler puis retirer l'excédent d'eau.","Cuire les gnocchis dans une grande casserole d'eau bouillante salée selon les indications du paquet, généralement 2 à 3 minutes. Les égoutter dès qu'ils remontent à la surface.","Mélanger les gnocchis, les épinards et la sauce au potimarron dans un grand plat à gratin.","Répartir la mozzarella égouttée et déchirée sur le dessus.","Enfourner pendant 12 à 15 minutes, jusqu'à ce que la mozzarella soit fondue et légèrement dorée. Laisser reposer 3 minutes avant de servir."],ingredients:[{nom:"Gnocchis",qte:750,rayon:3,unite:"g"},{nom:"Potimarron",qte:600,rayon:0,unite:"g"},{nom:"Épinards frais ou surgelés",qte:200,rayon:0,unite:"g"},{nom:"Haricots blancs cuits égouttés",qte:250,rayon:3,unite:"g"},{nom:"Mozzarella",qte:150,rayon:2,unite:"g"},{nom:"Crème légère",qte:100,rayon:2,unite:"ml"},{nom:"Oignon",qte:1,rayon:0,unite:"piece"},{nom:"Ail",qte:1,rayon:0,unite:"gousse"},{nom:"Huile d'olive",qte:1,rayon:3,unite:"cas"},{nom:"Muscade",qte:1,rayon:3,unite:"pincee"},{nom:"Sel",qte:1,rayon:3,unite:"pincee"},{nom:"Poivre",qte:1,rayon:3,unite:"pincee"}],nom:"Gratin de gnocchis au potimarron, épinards et mozzarella",personnes:4,temps:40},review:{state:"pending_household_and_culinary_review",priority:"P1",productionModeCandidate:"whole_batch",sourceDeclaredPeople:4,proposedServings:4,yieldEvidence:"source_declared_only",yieldNote:"Nombre de portions repris de la V1 à titre provisoire, sans validation de la satiété ni du rendement physique.",producedUnitCount:null,mealCompleteness:"already_in_recipe",animalIngredientsGramsPerSourcePerson:null,dryStarchesGramsPerSourcePerson:null,auditFlags:["PLAT_A_PRODUCTION_ENTIERE","BASE_EGOUTTE_A_VERIFIER","PRODUIT_ALTERNATIF","VERIFIER_CAPACITE_DU_PLAT_ET_CONVIVES"],ingre uisson des pâtes, éplucher et hacher finement 1 gousse d'ail. Égoutter les 140 g de thon au naturel et l'émietter à la fourchette. Égoutter les 125 g de mozzarella et les couper en petits morceaux.","FAIRE REVENIR L'AIL : Dans une grande poêle, faire chauffer 1 cuillère à café d'huile d'olive à feu moyen-doux. Ajouter la gousse d'ail hachée et faire revenir 30 secondes sans laisser colorer.","PRÉPARER LA SAUCE TOMATE : Verser les 250 g de pulpe de tomate dans la poêle. Ajouter 1 cuillère à café d'origan séché, une pincée de sel et une pincée de poivre. Mélanger et laisser mijoter 5 minutes à feu moyen-doux.","AJOUTER LE THON : Incorporer les 140 g de thon émietté à la sauce tomate. Mélanger délicatement et poursuivre la cuisson 2 minutes à feu doux.","MÉLANGER LES PÂTES ET LA SAUCE : Ajouter les 200 g de penne cuites et égouttées dans la poêle. Verser progressivement 30 à 50 ml d'eau de cuisson réservée pour détendre la sauce. Mélanger pendant 1 minute à feu moyen jusqu'à ce que les pâtes soient bien enrobées.","FAIRE FONDRE LA MOZZARELLA : Répartir les 125 g de mozzarella sur les pâtes. Couvrir la poêle et laisser chauffer 1 à 2 minutes à feu très doux, juste assez pour que le fromage commence à fondre.","SERVIR : Répartir les penne au thon, tomate et mozzarella dans 2 assiettes. Servir immédiatement. Ajuster les portions selon l'appétit, notamment après une séance de sport."],ingredients:[{nom:"Penne",qte:200,rayon:3,unite:"g"},{nom:"Thon au naturel égoutté",qte:140,rayon:3,unite:"g"},{nom:"Pulpe de tomate",qte:250,rayon:3,unite:"g"},{nom:"Mozzarella",qte:125,rayon:2,unite:"g"},{nom:"Ail",qte:1,rayon:0,unite:"gousse"},{nom:"Huile d'olive",qte:1,rayon:3,unite:"cc"},{nom:"Origan séché",qte:1,rayon:3,unite:"cc"},{nom:"Sel",qte:1,rayon:3,unite:"pincee"},{nom:"Poivre",qte:1,rayon:3,unite:"pincee"}],nom:"Penne au thon, tomate et mozzarella fondante",personnes:2,temps:20},review:{state:"pending_household_and_culinary_review",priority:"P2",productionModeCandidate:"adjusta t dorée.","Pendant ce temps, détailler le brocoli en fleurettes et le cuire à la vapeur pendant 6 à 8 minutes, jusqu'à ce qu'il soit tendre mais encore légèrement ferme.","Servir les filets de poisson avec les pommes de terre rôties et le brocoli. Arroser de quelques gouttes de jus de citron juste avant de déguster."],ingredients:[{nom:"Filets de colin ou lieu noir",qte:450,rayon:1,unite:"g"},{nom:"Pommes de terre",qte:650,rayon:0,unite:"g"},{nom:"Brocoli",qte:500,rayon:0,unite:"g"},{nom:"Moutarde",qte:2,rayon:3,unite:"cas"},{nom:"Chapelure",qte:45,rayon:3,unite:"g"},{nom:"Persil frais",qte:.5,rayon:0,unite:"botte"},{nom:"Citron",qte:1,rayon:0,unite:"piece"},{nom:"Ail",qte:2,rayon:0,unite:"gousse"},{nom:"Huile d'olive",qte:2,rayon:3,unite:"cas"},{nom:"Paprika",qte:1,rayon:3,unite:"cc"},{nom:"Sel",qte:1,rayon:3,unite:"pincee"},{nom:"Poivre",qte:1,rayon:3,unite:"pincee"}],nom:"Poisson blanc en croûte moutarde et herbes, pommes de terre rôties et brocoli",personnes:3,temps:40},review:{state:"pending_household_and_culinary_review",priority:"P2",productionModeCandidate:"adjustable",sourceDeclaredPeople:3,proposedServings:3,yieldEvidence:"source_declared_only",yieldNote:"Nombre de portions repris de la V1 à titre provisoire, sans validation de la satiété ni du rendement physique.",producedUnitCount:null,mealCompleteness:"check_meal_completeness",animalIngredientsGramsPerSourcePerson:150,dryStarchesGramsPerSourcePerson:null,auditFlags:["INGREDIENT_A_CHOISIR","PRODUIT_ALTERNATIF"],ingredientsWithReviewFlags:[{ingredientIndex:0,name:"Filets de colin ou lieu noir",flags:["PRODUIT_ALTERNATIF_À_CHOISIR"]},{ingredientIndex:3,name:"Moutarde",flags:["MESURE_CULINAIRE_NON_CONVERTIE"]},{ingredientIndex:8,name:"Huile d'olive",flags:["MESURE_CULINAIRE_NON_CONVERTIE"]},{ingredientIndex:9,name:"Paprika",flags:["MESURE_CULINAIRE_NON_CONVERTIE"]}],ingredientChangeProposals:[],specificReviewNote:"Contrôler les quantités en assiette et le rendement réel avant validation, sans extrapolation ent pendant 5 à 7 minutes, jusqu'à ce que le poulet soit complètement cuit à cœur. Éviter une forte ébullition pour préserver l'onctuosité de la sauce.","Pendant ce temps, cuire les pâtes al dente selon les indications du paquet. Réserver environ 150 ml d'eau de cuisson avant de les égoutter.","Cuire les haricots verts dans de l'eau bouillante salée ou à la vapeur pendant 7 à 10 minutes selon leur taille et leur état frais ou surgelé. Ils doivent être tendres mais conserver une légère fermeté.","Goûter la sauce et ajuster le poivre. Ajouter du sel uniquement si nécessaire, car le bouillon et les moutardes en apportent déjà.","Ajouter les pâtes égouttées dans la sauteuse avec le poulet. Mélanger délicatement pour bien les enrober de sauce. Verser progressivement quelques cuillères d'eau de cuisson des pâtes si la sauce est trop épaisse.","Incorporer les haricots verts aux pâtes ou les conserver en accompagnement selon les préférences.","Répartir dans trois assiettes creuses, napper avec le reste de sauce à la moutarde et terminer avec du persil frais ciselé. Servir immédiatement."],ingredients:[{nom:"Blanc de poulet",qte:450,rayon:1,unite:"g"},{nom:"Pâtes (penne ou fusilli)",qte:240,rayon:3,unite:"g"},{nom:"Haricots verts frais ou surgelés",qte:450,rayon:0,unite:"g"},{nom:"Crème légère 12 à 15 % MG",qte:150,rayon:2,unite:"g"},{nom:"Oignon",qte:1,rayon:0,unite:"piece"},{nom:"Ail",qte:2,rayon:0,unite:"gousse"},{nom:"Bouillon de volaille",qte:150,rayon:3,unite:"ml"},{nom:"Moutarde à l'ancienne",qte:1,rayon:3,unite:"cas"},{nom:"Moutarde de Dijon",qte:1,rayon:3,unite:"cc"},{nom:"Huile d'olive",qte:1,rayon:3,unite:"cas"},{nom:"Thym",qte:1,rayon:3,unite:"cc"},{nom:"Persil",qte:.5,rayon:0,unite:"botte"},{nom:"Sel",qte:1,rayon:3,unite:"pincee"},{nom:"Poivre",qte:1,rayon:3,unite:"pincee"}],nom:"Poulet crémeux à la moutarde, pâtes et haricots verts",personnes:3,temps:30},review:{state:"pending_household_and_culinary_review",priority:"P2",productionModeCandidate:"adjustable",sou
